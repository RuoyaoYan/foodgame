<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>吃</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 开始界面 / Title screen -->
<div id="title" class="title-screen">
  <div class="lang-switch title-lang" role="group" aria-label="Language">
    <button data-lang="zh">中文</button><button data-lang="en">EN</button>
  </div>
  <div class="floaters" id="floaters"></div>
  <div class="title-inner">
    <div class="seal" data-i18n="seal">寻味</div>
    <h1 class="logo">吃</h1>
    <div class="logo-pinyin">Chī</div>
    <p class="tagline" data-i18n-html="tagline"></p>
    <div id="saveInfo" class="save-info"></div>
    <div class="title-buttons">
      <button id="startBtn" class="big-btn"></button>
      <button id="newGameBtn" class="link hidden"></button>
    </div>
  </div>
  <div class="title-foot" data-i18n="footVersion"></div>
</div>

<header class="topbar">
  <button class="logo-small" id="homeBtn" data-i18n-title="homeTitle">吃</button>
  <div class="stats">
    <span class="gold">🪙 <b id="gold">0</b></span>
    <span class="income">+<b id="income">0</b><span data-i18n="perSec"></span></span>
    <div class="lang-switch" role="group" aria-label="Language">
      <button data-lang="zh">中文</button><button data-lang="en">EN</button>
    </div>
  </div>
</header>

<nav class="tabs">
  <button data-tab="map" class="active" data-i18n="tabMap"></button>
  <button data-tab="market" data-i18n="tabMarket"></button>
  <button data-tab="kitchen" data-i18n="tabKitchen"></button>
  <button data-tab="journal"><span data-i18n="tabJournal"></span> <span id="journalCount"></span></button>
</nav>

<main>
  <section id="tab-map" class="panel active">
    <h2 data-i18n="mapTitle"></h2>
    <p class="sub" data-i18n="mapSub"></p>
    <div class="map-wrap">
      <div id="worldMap"></div>
      <div id="mapPopup" class="map-popup hidden"></div>
    </div>
    <div id="cityList" class="cards"></div>
  </section>

  <section id="tab-market" class="panel">
    <h2 data-i18n="marketTitle"></h2>
    <div id="marketCityTabs" class="pills"></div>
    <h3 data-i18n="ingredients"></h3>
    <div id="marketIngredients" class="cards small"></div>
    <h3><span data-i18n="recipeShop"></span> <span class="sub" data-i18n="recipeShopSub"></span></h3>
    <div id="marketRecipes" class="cards small"></div>
  </section>

  <section id="tab-kitchen" class="panel">
    <h2 data-i18n="kitchenTitle"></h2>
    <p class="sub" data-i18n="kitchenSub"></p>
    <div class="kitchen">
      <div class="bag">
        <h3 data-i18n="bag"></h3>
        <div id="bag" class="bag-grid"></div>
      </div>
      <div class="pot-area">
        <div id="pot" class="pot" data-i18n-title="potHint">
          <div id="potItems" class="pot-items"></div>
          <div class="pot-label" data-i18n="pot"></div>
        </div>
        <div class="pot-actions">
          <button id="clearPot" class="ghost" data-i18n="clear"></button>
          <button id="cookBtn" class="primary" data-i18n="cook"></button>
        </div>
        <div id="cookMsg" class="msg"></div>
      </div>
    </div>
  </section>

  <section id="tab-journal" class="panel">
    <h2 data-i18n="journalTitle"></h2>
    <div id="journal" class="cards journal"></div>
  </section>
</main>

<div id="modal" class="modal hidden">
  <div class="modal-card" id="modalCard"></div>
</div>
<div id="toast" class="toast"></div>

<footer>
  <button id="resetBtn" class="link"></button>
</footer>

<script src="data/game.js"></script>
<script src="i18n.js"></script>
<script src="worldmap.js"></script>
<script src="game.js"></script>
</body>
</html>
